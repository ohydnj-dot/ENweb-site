<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN Global | Dignified Silver Care Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; overflow-x: hidden; }
        .fade-in { animation: fadeIn 1s ease-in; }
        [x-cloak] { display: none !important; }
        .hero-gradient { background: radial-gradient(circle at 50% 50%, #fffcf9 0%, #ffffff 100%); }
    </style>
</head>
<body x-data="app()" class="bg-white text-gray-900 hero-gradient">

    <header class="fixed w-full top-0 bg-white/80 backdrop-blur-md z-50 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" @click="window.scrollTo(0,0)">
                <div class="w-10 h-10 bg-[#db7536] rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg animate__animated animate__bounceIn">EN</div>
                <span class="font-bold text-xl tracking-tight">Silver Care</span>
            </div>
            
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-600">
                <a href="#products" class="hover:text-[#db7536] transition-colors" x-text="t().nav.products"></a>
                <a href="#about" class="hover:text-[#db7536] transition-colors" x-text="t().nav.about"></a>
            </nav>

            <div class="flex items-center gap-4">
                <div class="bg-gray-100 p-1 rounded-full flex border border-gray-200">
                    <button @click="setLang('EN')" :class="lang === 'EN' ? 'bg-white shadow-sm text-[#db7536]' : 'text-gray-400'" class="px-3 py-1 rounded-full text-xs font-bold transition-all">EN</button>
                    <button @click="setLang('JP')" :class="lang === 'JP' ? 'bg-white shadow-sm text-[#db7536]' : 'text-gray-400'" class="px-3 py-1 rounded-full text-xs font-bold transition-all">JP</button>
                    <button @click="setLang('KR')" :class="lang === 'KR' ? 'bg-white shadow-sm text-[#db7536]' : 'text-gray-400'" class="px-3 py-1 rounded-full text-xs font-bold transition-all">KR</button>
                </div>
            </div>
        </div>
    </header>

    <main class="pt-32">
        <section class="max-w-7xl mx-auto px-6 py-20 text-center">
            <div class="inline-block px-4 py-1.5 mb-6 text-sm font-semibold text-[#db7536] bg-orange-50 rounded-full animate__animated animate__fadeInDown">
                Innovation in Hygiene
            </div>
            <h1 class="text-5xl md:text-7xl font-bold tracking-tighter mb-8 leading-[1.1] animate__animated animate__fadeInUp" x-text="t().hero.title"></h1>
            <p class="text-xl text-gray-500 max-w-2xl mx-auto leading-relaxed animate__animated animate__fadeIn" x-text="t().hero.subtitle"></p>
            
            <div class="mt-12 flex justify-center gap-4 animate__animated animate__fadeInUp animate__delay-1s">
                <a href="#products" class="px-8 py-4 bg-gray-900 text-white rounded-2xl font-bold hover:bg-[#db7536] transition-all shadow-lg hover:scale-105" x-text="t().buttons.explore"></a>
            </div>
        </section>

        <section id="products" class="py-24 bg-gray-50/50 px-6">
            <div class="max-w-7xl mx-auto">
                <div class="flex justify-between items-end mb-12">
                    <h2 class="text-3xl font-bold tracking-tight" x-text="t().nav.products"></h2>
                </div>
                <div class="grid md:grid-cols-3 gap-8">
                    <template x-for="product in products" :key="product.id">
                        <div class="group bg-white rounded-[40px] overflow-hidden border border-gray-100 shadow-sm hover:shadow-2xl transition-all duration-500">
                            <div class="aspect-[4/5] overflow-hidden bg-gray-100 relative">
                                <img :src="product.image" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                            </div>
                            <div class="p-8">
                                <h3 class="text-2xl font-bold mb-4" x-text="product.name[lang]"></h3>
                                <button class="w-full py-4 bg-gray-50 group-hover:bg-[#db7536] group-hover:text-white text-gray-900 rounded-2xl font-bold transition-colors" x-text="t().buttons.details"></button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-white py-20 border-t border-gray-100 px-6 text-center">
        <div class="max-w-7xl mx-auto opacity-40 text-sm font-medium">
            &copy; 2026 EN Silver Care. Dedicated to Senior Dignity.
        </div>
    </footer>

    <script>
        function app() {
            return {
                lang: 'KR',
                translations: {
                    EN: {
                        nav: { products: "Products", about: "About Us" },
                        hero: { title: "Dignity in Every Touch.", subtitle: "Specialized senior hygiene solutions developed through Academic R&D partnership with Hanyang University." },
                        buttons: { explore: "Explore Solutions", details: "View Details" }
                    },
                    JP: {
                        nav: { products: "製品情報", about: "会社概要" },
                        hero: { title: "すべての瞬間に尊厳을。", subtitle: "漢陽大学校産学協力団との研究開発を通じて生まれた、シニア専用의 衛生ソリューション。" },
                        buttons: { explore: "ソリューションを見る", details: "詳細を見る" }
                    },
                    KR: {
                        nav: { products: "제품 정보", about: "브랜드 스토리" },
                        hero: { title: "모든 순간에 존엄을.", subtitle: "한양대학교 산학협력단과의 R&D 파트너십을 통해 탄생한 시니어 전용 위생 솔루션입니다." },
                        buttons: { explore: "솔루션 둘러보기", details: "자세히 보기" }
                    }
                },
                products: [
                    { id: 'wipes', image: 'https://www.enbcs.kr/theme/enbcs/img/business/new_eq_2.jpg', name: { EN: 'Senior Care Wipes', JP: 'シニアケアシート', KR: '시니어 케어 시트' } },
                    { id: 'machine1', image: 'https://www.enbcs.kr/theme/enbcs/img/business/ts2.jpg', name: { EN: 'Auto Folding System', JP: '自動折り機', KR: '자동 접지 시스템' } },
                    { id: 'machine2', image: 'https://www.enbcs.kr/theme/enbcs/img/business/ts3.jpg', name: { EN: 'Smart Packaging', JP: '스마트 包装機', KR: '스마트 포장 시스템' } }
                ],
                setLang(l) { this.lang = l; },
                t() { return this.translations[this.lang]; }
            }
        }
        window.onload = () => { lucide.createIcons(); };
    </script>
</body>
</html>
